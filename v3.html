<!--
  A Cup of Ambition — Beslisboom v3 (Conversational)
  ===================================================
  Chat-style interface: Britt sends questions as messages,
  user taps answers. Full conversation history stays visible.
  Same AC integration + AI personalization as v2.
-->
<div id="chat-root"></div>

<style>
  #chat-root {
    --c-bg: #fdf8f4;
    --c-card: #ffffff;
    --c-ink: #2a1411;
    --c-muted: #7a6660;
    --c-accent: #5c1f1a;
    --c-accent-dark: #3f120e;
    --c-gold: #c8923b;
    --c-soft: #f5e8e4;
    --c-border: #ebe0d8;
    --c-green: #2f9e6b;

    box-sizing: border-box;
    max-width: 520px;
    margin: 0 auto;
    padding: 0;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: var(--c-ink);
    line-height: 1.5;
    font-size: 16px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    background: var(--c-bg);
  }
  #chat-root *, #chat-root *::before, #chat-root *::after { box-sizing: border-box; }

  /* ---------- Header ---------- */
  .ch-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    background: var(--c-accent);
    color: #fff;
    flex-shrink: 0;
  }
  .ch-header__avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(255,255,255,0.3);
  }
  .ch-header__info { flex: 1; }
  .ch-header__name { font-weight: 700; font-size: 16px; }
  .ch-header__status { font-size: 12px; opacity: 0.8; }

  /* ---------- Messages area ---------- */
  .ch-messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }

  /* ---------- Message bubbles ---------- */
  .ch-msg {
    max-width: 82%;
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 16px;
    line-height: 1.5;
    animation: chFadeIn 280ms ease both;
    word-wrap: break-word;
  }
  .ch-msg a { color: var(--c-accent); font-weight: 600; }
  @keyframes chFadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .ch-msg--bot {
    align-self: flex-start;
    background: var(--c-card);
    color: var(--c-ink);
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 3px rgba(42,20,17,0.06);
  }
  .ch-msg--user {
    align-self: flex-end;
    background: var(--c-accent);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .ch-msg--system {
    align-self: center;
    background: transparent;
    color: var(--c-muted);
    font-size: 13px;
    text-align: center;
    max-width: 100%;
    padding: 8px 0;
  }

  /* ---------- Typing indicator ---------- */
  .ch-typing {
    align-self: flex-start;
    display: flex;
    gap: 4px;
    padding: 14px 20px;
    background: var(--c-card);
    border-radius: 18px;
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 3px rgba(42,20,17,0.06);
    animation: chFadeIn 200ms ease both;
  }
  .ch-typing__dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--c-muted);
    animation: chTypingBounce 1.2s infinite;
  }
  .ch-typing__dot:nth-child(2) { animation-delay: 0.15s; }
  .ch-typing__dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes chTypingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* ---------- Answer buttons ---------- */
  .ch-actions {
    flex-shrink: 0;
    padding: 12px 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--c-bg);
    border-top: 1px solid var(--c-border);
  }
  .ch-action {
    appearance: none;
    background: var(--c-card);
    border: 1.5px solid var(--c-border);
    border-radius: 24px;
    padding: 14px 20px;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    color: var(--c-ink);
    cursor: pointer;
    text-align: center;
    transition: all 140ms ease;
  }
  .ch-action:hover {
    border-color: var(--c-accent);
    color: var(--c-accent);
    transform: translateY(-1px);
  }
  .ch-action--selected {
    background: var(--c-accent);
    color: #fff;
    border-color: var(--c-accent);
    transform: scale(0.97);
    pointer-events: none;
  }
  .ch-action--primary {
    background: var(--c-accent);
    color: #fff;
    border-color: var(--c-accent);
  }
  .ch-action--primary:hover {
    background: var(--c-accent-dark);
    color: #fff;
  }
  .ch-action--ghost {
    background: transparent;
    border-color: var(--c-accent);
    color: var(--c-accent);
  }

  /* ---------- Email form in actions area ---------- */
  .ch-form { display: flex; flex-direction: column; gap: 10px; }
  .ch-form input {
    font: inherit; font-size: 16px;
    padding: 13px 16px;
    border: 1.5px solid var(--c-border);
    border-radius: 14px;
    background: var(--c-card);
    color: var(--c-ink);
    transition: border-color 140ms ease;
  }
  .ch-form input:focus { outline: none; border-color: var(--c-accent); }
  .ch-form__consent {
    display: flex; gap: 8px; align-items: flex-start;
    font-size: 13px; color: var(--c-muted); line-height: 1.4;
  }
  .ch-form__consent input { margin-top: 2px; accent-color: var(--c-accent); }
  .ch-form__privacy { font-size: 12px; color: var(--c-muted); text-align: center; }
  .ch-form__error { color: #c44a4a; font-size: 14px; text-align: center; }

  /* ---------- Result card inside chat ---------- */
  .ch-result {
    background: var(--c-card);
    border-radius: 18px;
    border-bottom-left-radius: 4px;
    padding: 20px;
    box-shadow: 0 2px 12px rgba(42,20,17,0.08);
    max-width: 92%;
    align-self: flex-start;
    animation: chFadeIn 400ms ease both;
  }
  .ch-result__badge {
    display: inline-block;
    background: var(--c-soft);
    color: var(--c-accent-dark);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 10px;
  }
  .ch-result__score {
    text-align: center;
    margin: 12px 0 16px;
  }
  .ch-result__score-ring { width: 90px; height: 90px; margin: 0 auto; position: relative; }
  .ch-result__score-ring svg { width: 100%; height: 100%; }
  .ch-result__score-num {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 800; color: var(--c-accent);
  }
  .ch-result__score-label {
    font-size: 11px; color: var(--c-muted); text-transform: uppercase;
    letter-spacing: 0.1em; font-weight: 600; margin-top: 4px;
  }
  .ch-result__title {
    font-size: 22px; font-weight: 800; line-height: 1.2; margin: 0 0 12px;
  }
  .ch-result p { margin: 0 0 10px; font-size: 15px; color: #2c2620; line-height: 1.55; }
  .ch-result strong { color: var(--c-ink); }
  .ch-result a { color: var(--c-accent); }
  .ch-result__radar { width: 220px; height: 220px; margin: 16px auto; }
  .ch-result__radar svg { width: 100%; height: 100%; }

  /* Dimension rows */
  .ch-dim { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--c-border); font-size: 14px; }
  .ch-dim__icon { font-size: 16px; flex-shrink: 0; }
  .ch-dim__name { font-weight: 700; color: var(--c-accent); font-size: 13px; }
  .ch-dim__text { color: #2c2620; line-height: 1.45; }
  .ch-dim__bar { height: 4px; border-radius: 2px; background: var(--c-soft); margin-top: 4px; overflow: hidden; }
  .ch-dim__fill { height: 100%; border-radius: 2px; transition: width 600ms ease; }
  .ch-dim__fill--high { background: var(--c-green); }
  .ch-dim__fill--med { background: var(--c-gold); }
  .ch-dim__fill--low { background: #c44a4a; }

  .ch-ai-text {
    background: linear-gradient(135deg, rgba(92,31,26,0.05), rgba(200,146,59,0.05));
    border-radius: 12px;
    padding: 14px;
    margin: 12px 0;
    font-size: 15px;
    line-height: 1.6;
    color: #2c2620;
    border-left: 3px solid var(--c-gold);
  }

  /* ---------- Confetti ---------- */
  .ch-confetti {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 9999;
  }

  @media (max-width: 480px) {
    .ch-msg { max-width: 88%; font-size: 15px; }
    .ch-result { max-width: 95%; padding: 16px; }
    .ch-result__title { font-size: 20px; }
    .ch-result__radar { width: 180px; height: 180px; }
  }
</style>

  // ====================================================================

  function computeScores(history) {
    var scores = {};
    DIMENSIONS.forEach(function (d) { scores[d.key] = { value: 15, tone: 'none' }; });
    history.forEach(function (h) {
      var node = TREE.nodes[h.nodeId];
      if (!node || !node.dimension) return;
      var answer = node.answers.find(function (a) { return a.label === h.answerLabel; });
      if (!answer) return;
      var val = answer.tone === 'yes' ? 100 : answer.tone === 'maybe' ? 50 : 25;
      scores[node.dimension] = { value: val, tone: answer.tone };
    });
    return scores;
  }
  function overallScore(scores) {
    var t = 0; DIMENSIONS.forEach(function (d) { t += scores[d.key].value; }); return Math.round(t / DIMENSIONS.length);
  }

  // ====================================================================

  function buildRadarSVG(scores, size) {
    var cx=size/2, cy=size/2, r=size*0.36, n=DIMENSIONS.length, lr=r+22;
    function pc(i, rad) { var a=Math.PI*2*i/n-Math.PI/2; return { x:cx+rad*Math.cos(a), y:cy+rad*Math.sin(a) }; }
    var s='<svg viewBox="0 0 '+size+' '+size+'" xmlns="http://www.w3.org/2000/svg">';

    var dp=[],dots='';
    DIMENSIONS.forEach(function(d,i){var v=scores[d.key].value/100,p=pc(i,r*Math.max(v,0.08));dp.push(p.x.toFixed(1)+','+p.y.toFixed(1));dots+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3.5" fill="#5c1f1a" stroke="#fff" stroke-width="1.5"/>';});

    DIMENSIONS.forEach(function(d,i){var p=pc(i,lr);s+='<text x="'+p.x.toFixed(1)+'" y="'+(p.y-5).toFixed(1)+'" text-anchor="middle" font-size="10" font-weight="700" fill="#2a1411">'+d.label+'</text><text x="'+p.x.toFixed(1)+'" y="'+(p.y+7).toFixed(1)+'" text-anchor="middle" font-size="9" font-weight="600" fill="#c8923b">'+scores[d.key].value+'%</text>';});

  // ====================================================================

  // ====================================================================

  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html !== undefined) { if (typeof html === 'string') n.innerHTML = html; }
    return n;
  }

  function scrollBottom() {
    setTimeout(function () { messagesEl.scrollTop = messagesEl.scrollHeight; }, 50);

  // ====================================================================
  // Message queue (typing delay between messages)
  // ====================================================================
  var msgQueue = [];
  var isProcessing = false;

  function queueBotMsg(html, delay) {
    msgQueue.push({ html: html, delay: delay || 600 });
    if (!isProcessing) processQueue();
  }

  function queueAction(callback) {
    msgQueue.push({ action: callback, delay: 300 });
    if (!isProcessing) processQueue();
  }

  function processQueue() {
    if (msgQueue.length === 0) { isProcessing = false; return; }
    isProcessing = true;
    var item = msgQueue.shift();

    // Show typing indicator
    var typing = el('div', 'ch-typing');
    typing.innerHTML = '<div class="ch-typing__dot"></div><div class="ch-typing__dot"></div><div class="ch-typing__dot"></div>';
    messagesEl.appendChild(typing);
    scrollBottom();

    setTimeout(function () {
      typing.remove();
      if (item.action) {
        item.action();
      } else {
        addBotMsg(item.html);
      }
      scrollBottom();
      processQueue();
    }, item.delay);
  }

  function addBotMsg(html) {
    var msg = el('div', 'ch-msg ch-msg--bot', html);
    messagesEl.appendChild(msg);
    scrollBottom();
  }

  function addUserMsg(text) {
    var msg = el('div', 'ch-msg ch-msg--user');
    msg.textContent = text;
    messagesEl.appendChild(msg);
    scrollBottom();
  }

  function addSystemMsg(text) {
    var msg = el('div', 'ch-msg ch-msg--system');
    msg.textContent = text;
    messagesEl.appendChild(msg);
    scrollBottom();
  }

  function clearActions() { actionsEl.innerHTML = ''; }

  // ====================================================================
  // Init
  // ====================================================================
  function init() {
    root.innerHTML = '';

    // Header
    var header = el('div', 'ch-header');
    header.innerHTML = '<img class="ch-header__avatar" src="logo.jpg" alt="Britt"><div class="ch-header__info"><div class="ch-header__name">Britt — A Cup of Ambition</div><div class="ch-header__status">Online</div></div>';
    root.appendChild(header);

    // Messages
    messagesEl = el('div', 'ch-messages');
    root.appendChild(messagesEl);

    // Actions
    actionsEl = el('div', 'ch-actions');
    actionsEl.style.display = 'none';
    root.appendChild(actionsEl);

    // Start conversation
    startConversation();
  }

  function startConversation() {
    queueBotMsg('Hey! \u{1F44B} Welkom bij A Cup of Ambition.');
    queueBotMsg('Ik ben Britt, en samen met Annick help ik vrouwen om het podium te beklimmen als betaald spreker.');
    queueBotMsg('Wil je ontdekken of jij er klaar voor bent? Ik stel je een paar korte vragen. \u{1F3A4}');
    queueAction(function () {
      showActions([
        { label: 'Ja, doe de test!', primary: true, onclick: function () {
          addUserMsg('Ja, doe de test!');
          clearActions();
          actionsEl.style.display = 'none';
          setTimeout(function () { askQuestion(TREE.start); }, 400);
        }},
      ]);
    });
  }

  // ====================================================================
  // Ask a question
  // ====================================================================
  function askQuestion(nodeId) {
    state.currentNodeId = nodeId;
    var node = TREE.nodes[nodeId];

    queueBotMsg('<strong>' + node.question + '</strong>');
    if (node.helper) {
      queueBotMsg('<em style="color:#7a6660;font-size:14px;">' + node.helper + '</em>', 400);
    }
    queueAction(function () {
      var btns = node.answers.map(function (a) {
        return {
          label: a.label,
          onclick: function () {
            addUserMsg(a.label);
            clearActions();
            actionsEl.style.display = 'none';
            state.history.push({ nodeId: nodeId, answerLabel: a.label });

            if (typeof a.next === 'string' && a.next.indexOf('result:') === 0) {
              state.pendingResult = a.next.split(':')[1];
              setTimeout(function () { askForEmail(); }, 500);
            } else {
              setTimeout(function () { askQuestion(a.next); }, 400);
            }
          }
        };
      });
      showActions(btns);
    });
  }

  // ====================================================================
  // Email gate
  // ====================================================================
  function askForEmail() {
    queueBotMsg('Top! Ik heb je resultaat klaar. ✨');
    queueBotMsg('Waar mag ik je persoonlijke analyse naartoe sturen?');
    queueAction(function () {
      showEmailForm();
    });
  }

  function showEmailForm() {
    actionsEl.style.display = '';
    actionsEl.innerHTML = '';
    var form = el('div', 'ch-form');
    form.innerHTML = '<input type="text" id="ch-name" placeholder="Jouw naam" autocomplete="name">' +
      '<input type="email" id="ch-email" placeholder="jij@voorbeeld.nl" autocomplete="email">' +
      '<label class="ch-form__consent"><input type="checkbox" id="ch-consent"><span>Ja, stuur me ook inspiratie van A Cup of Ambition. (Optioneel)</span></label>' +
      '<div class="ch-form__privacy">\u{1F512} Geen spam — je e-mailadres blijft bij ons.</div>' +
      '<div class="ch-form__error" id="ch-error"></div>';
    actionsEl.appendChild(form);

    var btn = el('button', 'ch-action ch-action--primary');
    btn.textContent = 'Toon mijn analyse';
    btn.onclick = function () { submitEmailForm(btn); };
    actionsEl.appendChild(btn);
  }

  function submitEmailForm(btn) {
    var nameVal = document.getElementById('ch-name').value.trim();
    var emailVal = document.getElementById('ch-email').value.trim();
    var consent = document.getElementById('ch-consent').checked;
    var err = document.getElementById('ch-error');

    if (!nameVal || !emailVal) { err.textContent = 'Vul je naam en e-mailadres in.'; return; }
    if (emailVal.indexOf('@') === -1) { err.textContent = 'Voer een geldig e-mailadres in.'; return; }

    state.userName = nameVal;
    btn.disabled = true;
    btn.textContent = 'Bezig...';

    var outcomeTag = RESULT_DEFS[state.pendingResult].tag;
    var data = new FormData();
    Object.keys(AC_FORM).forEach(function (k) { data.append(k, AC_FORM[k]); });
    data.append('fullname', nameVal);
    data.append('email', emailVal);
    data.append(AC_OUTCOME_FIELD, outcomeTag);
    var tags = ['beslisboom-lead', 'beslisboom-v3', outcomeTag];
    if (consent) tags.push('nieuwsbrief');
    data.append('tags', tags.join(','));

    fetch(AC_ENDPOINT, { method: 'POST', mode: 'no-cors', body: data })
      .then(function () {
        addUserMsg(nameVal + ' — ' + emailVal);
        clearActions();
        actionsEl.style.display = 'none';
        showAnalyzing();
      })
      .catch(function () {
        btn.disabled = false;
        btn.textContent = 'Toon mijn analyse';
        err.textContent = 'Er ging iets mis. Probeer het nog eens.';
      });
  }

  // ====================================================================
  // Analyzing + result
  // ====================================================================
  function showAnalyzing() {
    queueBotMsg('Dankje, ' + state.userName + '! Even kijken naar je antwoorden...');

    var aiDone = false, aiText = null, minTime = 2200, start = Date.now();

    if (AI_ENDPOINT) {
      fetchAI(function (text) { aiText = text; aiDone = true; tryShow(); });
    } else {
      aiDone = true;
    }

    function tryShow() {
      if (!aiDone) return;
      var elapsed = Date.now() - start;
      var wait = Math.max(0, minTime - elapsed);
      setTimeout(function () {
        state.aiText = aiText;
        state.finalResult = state.pendingResult;
        showResult();
      }, wait);
    }

    setTimeout(function () { if (!aiDone) { aiDone = true; tryShow(); } }, 6000);
    if (!AI_ENDPOINT) tryShow();
  }

  function fetchAI(callback) {
    var payload = { answers: state.history.map(function (h) { return { nodeId: h.nodeId, answer: h.answerLabel }; }), outcome: state.pendingResult, name: state.userName };
    fetch(AI_ENDPOINT, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) })
      .then(function (r) { return r.ok ? r.json() : { text: null }; })
      .then(function (d) { callback(d.text || null); })
      .catch(function () { callback(null); });
  }

  function showResult() {
    var key = state.finalResult;
    var r = RESULT_DEFS[key];
    var scores = computeScores(state.history);
    var score = overallScore(scores);

    // Build result card HTML
    var html = '<div class="ch-result__badge">' + r.badge + '</div>';

    // Score ring
    var circ = 2 * Math.PI * 42;
    var off = circ - (circ * score / 100);
    html += '<div class="ch-result__score"><div class="ch-result__score-ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="#ebe0d8" stroke-width="7"/><circle cx="50" cy="50" r="42" fill="none" stroke="#5c1f1a" stroke-width="7" stroke-linecap="round" stroke-dasharray="' + circ.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '" transform="rotate(-90 50 50)"/></svg><div class="ch-result__score-num">' + score + '%</div></div><div class="ch-result__score-label">Speaker Readiness Score</div></div>';

    html += '<div class="ch-result__title">' + r.title + '</div>';

    // AI text (strip any markdown formatting the model might include)
    if (state.aiText) {
      var cleaned = state.aiText.replace(/^#+\s+[^\n]*/gm, '').replace(/\*\*/g, '').replace(/__/g, '').replace(/^\s*\n/gm, '').trim();
      if (cleaned) html += '<div class="ch-ai-text">' + cleaned.replace(/\n/g, '<br>') + '</div>';
    }

    // Body
    r.body.forEach(function (p) { html += '<p>' + p + '</p>'; });

    // Tailored lead for work outcome
    if (key === 'work') {
      var firstGap = null;
      for (var i = 0; i < state.history.length; i++) {
        if (state.history[i].answerLabel !== 'Ja' && state.history[i].answerLabel !== 'Ja!' && state.history[i].answerLabel !== 'Ja, zeker') { firstGap = state.history[i].nodeId; break; }
      }
      var match = firstGap && GAP_CTAS[firstGap];
      if (match) html += '<p style="background:#f5e8e4;border-left:3px solid #c8923b;padding:10px 12px;border-radius:8px;font-size:14px;"><strong>' + match.lead + '</strong></p>';
    }

    // List
    if (r.list) {
      html += '<ul style="padding-left:18px;margin:8px 0;">';
      r.list.forEach(function (li) { html += '<li style="margin-bottom:10px;font-size:14px;line-height:1.5;">' + li + '</li>'; });
      html += '</ul>';
    }

    // Radar
    html += '<div class="ch-result__radar">' + buildRadarSVG(scores, 220) + '</div>';

    // Dimension rows
    DIMENSIONS.forEach(function (d) {
      var s = scores[d.key];
      var fb = FEEDBACK[d.key];
      var text = fb[s.tone] || fb.none || '';
      var fillCls = s.value >= 75 ? 'ch-dim__fill--high' : s.value >= 50 ? 'ch-dim__fill--med' : 'ch-dim__fill--low';
      html += '<div class="ch-dim"><div class="ch-dim__icon">' + d.icon + '</div><div style="flex:1;"><div class="ch-dim__name">' + d.label + ' — ' + s.value + '%</div><div class="ch-dim__bar"><div class="ch-dim__fill ' + fillCls + '" style="width:' + s.value + '%;"></div></div><div class="ch-dim__text">' + text + '</div></div></div>';
    });

    // Add result card
    var card = el('div', 'ch-result');
    card.innerHTML = html;
    messagesEl.appendChild(card);
    scrollBottom();

    // Confetti for ready
    if (key === 'ready') setTimeout(fireConfetti, 300);

    // CTAs
    setTimeout(function () {
      var ctas = r.ctas;
      if (key === 'work') {
        var fg = null;
        for (var j = 0; j < state.history.length; j++) {
          if (state.history[j].answerLabel !== 'Ja' && state.history[j].answerLabel !== 'Ja!' && state.history[j].answerLabel !== 'Ja, zeker') { fg = state.history[j].nodeId; break; }
        }
        var m = fg && GAP_CTAS[fg];
        if (m) ctas = [{ label: m.label, href: m.href, primary: true }, { label: 'Alle opleidingen', href: 'https://www.acupofambition.nl/alle-trainingen1', primary: false }];
      }
      showActions(ctas.map(function (c) {
        return { label: c.label, primary: c.primary, onclick: function () { window.open(c.href, '_blank'); } };
      }));
    }, 800);
  }

  // ====================================================================
  // Show action buttons
  // ====================================================================
  function showActions(buttons) {
    actionsEl.style.display = '';
    actionsEl.innerHTML = '';
    buttons.forEach(function (b) {
      var cls = 'ch-action';
      if (b.primary) cls += ' ch-action--primary';
      else if (b.ghost) cls += ' ch-action--ghost';
      var btn = el('button', cls);
      btn.textContent = b.label;
      btn.onclick = function () {
        if (b.onclick) b.onclick();
      };
      actionsEl.appendChild(btn);
    });
  }

  // ====================================================================
  // Confetti
  // ====================================================================
  function fireConfetti() {
    var c = document.createElement('canvas');
    c.className = 'ch-confetti';
    document.body.appendChild(c);
    var ctx = c.getContext('2d');
    c.width = window.innerWidth * devicePixelRatio;
    c.height = window.innerHeight * devicePixelRatio;
    c.style.width = window.innerWidth + 'px';
    c.style.height = window.innerHeight + 'px';
    ctx.scale(devicePixelRatio, devicePixelRatio);
    var cols = ['#5c1f1a','#c8923b','#b89691','#f5e8e4','#3f120e'];
    var pcs = [], w = window.innerWidth, h = window.innerHeight;
    for (var i = 0; i < 120; i++) pcs.push({ x:w/2+(Math.random()-0.5)*100, y:h/3, vx:(Math.random()-0.5)*14, vy:-Math.random()*14-4, g:0.35+Math.random()*0.15, sz:6+Math.random()*8, rot:Math.random()*Math.PI*2, vr:(Math.random()-0.5)*0.4, col:cols[Math.floor(Math.random()*cols.length)], sh:Math.random()<0.5?'r':'c' });
    var st = performance.now(), DUR = 2600;
    function f(t) { var el=t-st; ctx.clearRect(0,0,w,h); pcs.forEach(function(p){ p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr; ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.col;ctx.globalAlpha=Math.max(0,1-el/DUR); if(p.sh==='r')ctx.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz*0.5); else{ctx.beginPath();ctx.arc(0,0,p.sz/2,0,Math.PI*2);ctx.fill();} ctx.restore(); }); if(el<DUR)requestAnimationFrame(f);else c.remove(); }
    requestAnimationFrame(f);
  }

  init();
})();
</script>
